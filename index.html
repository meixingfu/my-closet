<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Closet - Romantic Promenade</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --accent-color: #d4a373;
      --pink-accent: #e8a5b8;
      --text-color: #4a3e3d;
      --border-color: #f0d9e1;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 20px 10px;
      border-bottom: 2px dashed var(--pink-accent);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #8b5e66;
      font-weight: normal;
      letter-spacing: 2px;
    }

    p.subtitle {
      margin-top: 5px;
      font-size: 0.85rem;
      color: #a38288;
    }

    /* コントロールエリア */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background-color: #fff;
      outline: none;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--pink-accent);
      background-color: #fff;
      color: #8b5e66;
      border-radius: 15px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: var(--pink-accent);
      color: #fff;
    }

    .r18-toggle {
      margin-top: 5px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #b05c6d;
    }

    /* グリッドカード表示 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(232, 165, 184, 0.15);
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background-color: #f7ede2;
    }

    .card-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin: 8px 0 4px 0;
      color: #5c4347;
    }

    .card-tag {
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .copy-btn {
      margin-top: auto;
      padding: 8px;
      background-color: #f7d6e0;
      border: none;
      border-radius: 8px;
      color: #6b3e4b;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .copy-btn:active {
      background-color: var(--pink-accent);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Closet</h1>
    <p class="subtitle">✨ Prompt & Outfit Collection ✨</p>
  </header>

  <div class="controls">
    <div class="search-bar">
      <input type="text" placeholder="衣装や雰囲気で検索...">
    </div>
    <div class="filter-group">
      <button class="filter-btn active">すべて</button>
      <button class="filter-btn">女性用</button>
      <button class="filter-btn">男性用</button>
      <button class="filter-btn">男女共通</button>
      <button class="filter-btn">その他</button>
    </div>
    <label class="r18-toggle">
      <input type="checkbox"> R-18表示を有効にする
    </label>
  </div>

  <div class="gallery">
    <!-- お試しサンプルカード1 -->
    <div class="card">
      <img src="https://via.placeholder.com/150/f7d6e0/6b3e4b?text=Rococo+Dress" alt="ロココドレス">
      <div class="card-title">クラシカルロココ</div>
      <div class="card-tag">女性用 / クラシック</div>
      <button class="copy-btn" onclick="navigator.clipboard.writeText('rococo dress, pastel pink, frills, ribbon, masterpiece')">プロンプトをコピー</button>
    </div>
    <!-- お試しサンプルカード2 -->
    <div class="card">
      <img src="https://via.placeholder.com/150/f0d9e1/5c4347?text=Gothic+Lolita" alt="ゴスロリ">
      <div class="card-title">ゴシックロリータ</div>
      <div class="card-tag">女性用 / ロリータ</div>
      <button class="copy-btn" onclick="navigator.clipboard.writeText('gothic lolita dress, black lace, bonnet, Victorian style')">プロンプトをコピー</button>
    </div>
  </div>

</body>
</html>
